name: Etarium Q battle scene acceptance
on:
  push:
    branches: [gh-pages]
    paths:
      - 'q/**'
      - 'etarium-q.html'
      - '.github/workflows/mobile-q-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run Q battle scene acceptance
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 &
          sleep 2
          node q/smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: etarium-q-battle-screenshot
          path: etarium-q-battle.png
          if-no-files-found: warn
