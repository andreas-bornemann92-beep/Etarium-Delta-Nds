name: Etarium Mobile H browser test
on:
  push:
    branches: [gh-pages]
    paths: ['h/**','.github/workflows/mobile-h-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run H mobile viewport test
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 &
          sleep 2
          node h/smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: etarium-mobile-h-browser-evidence
          path: mobile-h-browser.png
          if-no-files-found: warn
