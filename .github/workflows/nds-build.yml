name: Nintendo DS build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop/nds-cloud-build
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Inspect toolchain
        shell: bash
        run: |
          echo "DEVKITPRO=${DEVKITPRO:-unset}"
          echo "DEVKITARM=${DEVKITARM:-unset}"
          command -v arm-none-eabi-gcc || true
          command -v ndstool || true
          ls -la /opt/devkitpro || true
          ls -la /opt/devkitpro/libnds || true
      - name: Build ROM
        shell: bash
        run: make --debug=b
      - name: Verify ROM output
        shell: bash
        run: |
          test -s etarium.nds
          ls -lh etarium.nds
      - name: Upload Nintendo DS ROM
        uses: actions/upload-artifact@v4
        with:
          name: etarium-nds
          path: etarium.nds
          if-no-files-found: error
          retention-days: 14
