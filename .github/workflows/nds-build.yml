name: Nintendo DS build
# Build smoke test triggered from ChatGPT

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop/nds-cloud-build
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Inspect Nintendo DS dependencies
        shell: bash
        run: |
          echo "DEVKITPRO=${DEVKITPRO:-unset}"
          echo "DEVKITARM=${DEVKITARM:-unset}"
          for cmd in arm-none-eabi-gcc ndstool dkp-pacman; do
            if command -v "$cmd"; then echo "OK: $cmd"; else echo "MISSING COMMAND: $cmd"; fi
          done
          for path in "$DEVKITARM/ds_rules" "$DEVKITPRO/libnds/include/nds.h" "$DEVKITPRO/calico/include/calico.h" "$DEVKITPRO/calico/share/ds9.specs"; do
            if test -f "$path"; then echo "OK: $path"; else echo "NOT FOUND: $path"; fi
          done
          find "$DEVKITPRO" -maxdepth 5 \( -name calico.h -o -name ds9.specs -o -name nds.h \) -print 2>/dev/null || true
      - name: Build ROM
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make --no-print-directory
      - name: Verify ROM output
        shell: bash
        run: |
          test -s etarium.nds
          ls -lh etarium.nds
      - name: Upload Nintendo DS ROM
        uses: actions/upload-artifact@v4
        with:
          name: etarium-nds
          path: etarium.nds
          if-no-files-found: error
          retention-days: 14
