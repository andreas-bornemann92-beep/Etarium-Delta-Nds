name: Nintendo DS build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop/nds-cloud-build
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Verify Nintendo DS dependencies
        shell: bash
        run: |
          set -euo pipefail
          : "${DEVKITPRO:?DEVKITPRO not set}"
          : "${DEVKITARM:?DEVKITARM not set}"
          command -v arm-none-eabi-gcc
          command -v ndstool
          test -f "$DEVKITARM/ds_rules"
          test -f "$DEVKITPRO/libnds/include/nds.h"
          test -f "$DEVKITPRO/calico/include/calico.h"
          test -f "$DEVKITPRO/calico/share/ds9.specs"
          echo "Nintendo DS dependencies verified"
      - name: Build ROM
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make --no-print-directory
      - name: Verify ROM output
        shell: bash
        run: |
          test -s etarium.nds
          ls -lh etarium.nds
      - name: Upload Nintendo DS ROM
        uses: actions/upload-artifact@v4
        with:
          name: etarium-nds
          path: etarium.nds
          if-no-files-found: error
          retention-days: 14
