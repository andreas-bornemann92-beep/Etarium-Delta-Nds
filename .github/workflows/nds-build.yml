name: Nintendo DS build
# Build smoke test triggered from ChatGPT

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop/nds-cloud-build
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Inspect Nintendo DS dependencies
        shell: bash
        run: |
          echo "DEVKITPRO=${DEVKITPRO:-unset}"
          echo "DEVKITARM=${DEVKITARM:-unset}"
          for cmd in arm-none-eabi-gcc ndstool dkp-pacman; do
            if command -v "$cmd"; then echo "OK: $cmd"; else echo "MISSING COMMAND: $cmd"; fi
          done
          for path in "$DEVKITARM/ds_rules" "$DEVKITPRO/libnds/include/nds.h" "$DEVKITPRO/calico/include/calico.h" "$DEVKITPRO/calico/share/ds9.specs"; do
            if test -f "$path"; then echo "OK: $path"; else echo "NOT FOUND: $path"; fi
          done
          find "$DEVKITPRO" -maxdepth 5 \( -name calico.h -o -name ds9.specs -o -name nds.h \) -print 2>/dev/null || true
      - name: Build ROM
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make --no-print-directory
      - name: Verify ROM output
        shell: bash
        run: |
          test -s etarium.nds
          ls -lh etarium.nds
          ndstool -i etarium.nds
          python3 - <<'PY'
          import struct
          from pathlib import Path
          data = Path('etarium.nds').read_bytes()
          assert len(data) >= 0x4000, 'ROM too small'
          for name, off in [('ARM9', 0x20), ('ARM7', 0x30)]:
              rom, entry, ram, size = struct.unpack_from('<IIII', data, off)
              assert size > 0, f'{name}: empty binary'
              assert rom >= 0x200 and rom + size <= len(data), f'{name}: invalid ROM bounds'
              assert ram <= entry < ram + size, f'{name}: entry outside loaded binary'
              assert any(data[rom:rom+size]), f'{name}: all-zero program'
              print(f'{name}: ROM=0x{rom:08X}, RAM=0x{ram:08X}, ENTRY=0x{entry:08X}, SIZE={size}')
          assert data[0x12] in (0, 2), 'Unexpected NDS unit code'
          print('NDS static header/payload checks PASSED')
          PY
      - name: Upload Nintendo DS ROM
        uses: actions/upload-artifact@v4
        with:
          name: etarium-nds
          path: etarium.nds
          if-no-files-found: error
          retention-days: 14
