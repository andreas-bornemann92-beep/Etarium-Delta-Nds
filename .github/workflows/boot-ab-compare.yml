name: Etarium sequential A-B boot test
on:
  workflow_dispatch:
  push:
    branches: [develop/nds-cloud-build]
    paths: ['source/**','include/**','tests/independent_boot/**','.github/workflows/boot-ab-compare.yml']
permissions:
  contents: read
jobs:
  current:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile current Etarium
        run: |
          set -eu
          make clean && make
          ndstool -i etarium.nds
          mkdir -p dist
          cp etarium.nds dist/current.nds
      - uses: actions/upload-artifact@v4
        with:
          name: etarium-ab-current
          path: dist/current.nds
          if-no-files-found: error
  independent:
    needs: current
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile new independent DS ROM
        run: |
          set -eu
          sed -i 's|^SOURCES := source$|SOURCES := tests/independent_boot|' Makefile
          make clean && make
          ndstool -i etarium.nds
          mkdir -p dist
          cp etarium.nds dist/independent.nds
      - uses: actions/upload-artifact@v4
        with:
          name: etarium-ab-independent
          path: dist/independent.nds
          if-no-files-found: error
  emulator-compare:
    needs: [current, independent]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: etarium-ab-current
          path: roms/a
      - uses: actions/download-artifact@v4
        with:
          name: etarium-ab-independent
          path: roms/b
      - name: Install legacy melonDS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git cmake g++ pkg-config libsdl2-dev libarchive-dev libgtk-3-dev qtbase5-dev qtbase5-private-dev qtbase5-dev-tools libqt5opengl5-dev qtmultimedia5-dev libslirp-dev extra-cmake-modules xvfb xauth xdotool imagemagick python3-pil
      - uses: actions/cache@v4
        with:
          path: /tmp/melonds-095-build
          key: melonds-095-ubuntu2404-qt5-v1
      - name: Build legacy melonDS if necessary
        run: |
          set -eu
          if ! find /tmp/melonds-095-build -type f -name melonDS -executable | grep -q .; then
            git clone --depth 1 --branch 0.9.5 https://github.com/melonDS-emu/melonDS.git /tmp/melonds-095
            cmake -S /tmp/melonds-095 -B /tmp/melonds-095-build -DCMAKE_BUILD_TYPE=Release
            cmake --build /tmp/melonds-095-build --parallel 4
          fi
      - name: Test current ROM first, independent ROM second
        env:
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: '1'
          SDL_AUDIODRIVER: dummy
        run: |
          set -euo pipefail
          mkdir -p evidence
          emu="$(find /tmp/melonds-095-build -type f -name melonDS -executable | head -n 1)"
          test -n "$emu"
          for spec in 'a current' 'b independent'; do
            set -- $spec
            label="$2"
            rom="$GITHUB_WORKSPACE/roms/$1/$label.nds"
            mkdir -p "evidence/$label/home/melonDS"
            printf 'DirectBoot=1\nConsoleType=0\nExternalBIOSEnable=0\n' > "evidence/$label/home/melonDS/melonDS.ini"
            sha256sum "$rom" >> evidence/rom-hashes.txt
            echo "$label" >> evidence/execution-order.txt
            HOME="$GITHUB_WORKSPACE/evidence/$label/home" XDG_CONFIG_HOME="$GITHUB_WORKSPACE/evidence/$label/home" timeout -k 3s 18s xvfb-run -a -s '-screen 0 1280x900x24' bash -c '
              "$1" "$2" >/dev/null 2>&1 & pid=$!; sleep 7; wid="$(timeout 2s xdotool search --onlyvisible --name melonDS | head -n 1 || true)"; if [ -n "$wid" ]; then timeout -k 2s 5s import -window "$wid" "$3" >/dev/null 2>&1 || true; fi; kill -TERM "$pid" 2>/dev/null || true
              _ "$emu" "$rom" "$GITHUB_WORKSPACE/evidence/$label/screen.png" || true
          done
      - name: Assess separate results
        if: always()
        run: |
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          from PIL import Image,ImageChops
          data={'order':['current','independent'],'boot_verified':False}
          images={}
          for name in data['order']:
              p=Path('evidence')/name/'screen.png'
              data[name]={'captured':p.is_file()}
              if p.is_file():
                  im=Image.open(p).convert('RGB'); images[name]=im
                  data[name].update({'dimensions':list(im.size),'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          if len(images)==2:
              a,b=images['current'],images['independent']
              data['screens_identical']=a.size==b.size and ImageChops.difference(a,b).getbbox() is None
          Path('evidence/comparison.json').write_text(json.dumps(data,indent=2))
          print(json.dumps(data,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: etarium-ab-emulator-evidence
          path: evidence/
          if-no-files-found: warn
