name: Kortex-Etarium Sandbox Smoke Tests
on:
  push:
    branches: [kortex-etarium-sandbox]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s kortex-etarium-clone -p 'test_*.py' -v
