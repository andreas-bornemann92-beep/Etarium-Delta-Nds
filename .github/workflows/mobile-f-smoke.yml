name: Etarium Mobile F browser smoke test
on:
  push:
    branches: [gh-pages]
    paths: ['f/**','.github/workflows/mobile-f-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium automation
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local web server and test iPhone-sized viewport
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 &
          sleep 2
          node f/smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: etarium-mobile-f-browser-evidence
          path: mobile-f-smoke.png
          if-no-files-found: warn
