name: Etarium Mobile I animation browser test
on:
  push:
    branches: [gh-pages]
    paths: ['i/**','.github/workflows/mobile-i-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify 12 animation frames and all four directions
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 &
          sleep 2
          node i/smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: etarium-mobile-i-animation-evidence
          path: mobile-i-browser.png
          if-no-files-found: warn
