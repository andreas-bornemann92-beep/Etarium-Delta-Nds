name: Etarium emulator smoke test

on:
  workflow_dispatch:
  push:
    branches: [develop/nds-cloud-build]
    paths:
      - 'source/**'
      - 'Makefile'
      - 'tests/**'
      - 'include/**'
      - '.github/workflows/emulator-smoke.yml'

permissions:
  contents: read

concurrency:
  group: etarium-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-logic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run logic regression with address/undefined sanitizers
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror -O1 -g -fsanitize=address,undefined \
            -fno-omit-frame-pointer -Iinclude tests/native_logic_test.c -o /tmp/etarium-logic-test
          /tmp/etarium-logic-test
          for cycle in $(seq 1 10); do
            echo "Native regression cycle $cycle/10"
            /tmp/etarium-logic-test
          done

  rom:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Etarium
        run: |
          set -eu
          make clean
          make
          test -s etarium.nds
          ndstool -i etarium.nds
      - uses: actions/upload-artifact@v4
        with:
          name: emulator-input-rom
          path: etarium.nds
          retention-days: 7

  diagnostic-roms:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile isolated ARM9 and ARM7 IPC startup probes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic-roms
          for probe in arm9_minimal arm7_ipc; do
            cp Makefile Makefile.diagnostic-backup
            sed -i "s|^SOURCES := source$|SOURCES := tests/diagnostics/$probe|" Makefile
            make clean
            make
            test -s etarium.nds
            ndstool -i etarium.nds
            cp etarium.nds "diagnostic-roms/$probe.nds"
            mv Makefile.diagnostic-backup Makefile
          done
      - name: Build five isolated startup variants
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/generate_five_variants.py source/main.c diagnostic-sources
          cp diagnostic-sources/manifest.json diagnostic-roms/five-variants-manifest.json
          cp Makefile /tmp/etarium-original-makefile
          for d in diagnostic-sources/0*; do
            name="$(basename "$d")"
            echo "Building hypothesis $name"
            cp /tmp/etarium-original-makefile Makefile
            sed -i "s|^SOURCES := source$|SOURCES := $d|" Makefile
            make clean
            make --no-print-directory
            test -s etarium.nds
            cp etarium.nds "diagnostic-roms/$name.nds"
          done
          cp /tmp/etarium-original-makefile Makefile
          sha256sum diagnostic-roms/0*.nds
      - name: Compile official devkitPro hello_world control in native toolchain
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/devkitPro/nds-examples.git /tmp/nds-examples
          test -f /tmp/nds-examples/hello_world/Makefile
          make -C /tmp/nds-examples/hello_world --no-print-directory
          test -s /tmp/nds-examples/hello_world/hello_world.nds
          cp /tmp/nds-examples/hello_world/hello_world.nds diagnostic-roms/upstream_control.nds
          sha256sum diagnostic-roms/upstream_control.nds
      - uses: actions/upload-artifact@v4
        with:
          name: etarium-startup-probes
          path: diagnostic-roms/*.nds
          if-no-files-found: error
          retention-days: 14

  emulator:
    needs: [rom, diagnostic-roms]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: emulator-input-rom
          path: rom
      - uses: actions/download-artifact@v4
        with:
          name: etarium-startup-probes
          path: startup-probes
      - name: Initialize diagnostic output
        run: mkdir -p evidence && printf 'Workflow started\\n' > evidence/environment.txt
      - name: Install emulator build and capture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git cmake ninja-build g++ pkg-config extra-cmake-modules \
            libcurl4-gnutls-dev libpcap0.8-dev libsdl2-dev \
            libarchive-dev libenet-dev libzstd-dev libfaad-dev \
            qt6-base-dev qt6-base-private-dev qt6-multimedia-dev qt6-svg-dev \
            xvfb xauth xdotool imagemagick python3-pil
      - name: Build official melonDS from source
        run: |
          git clone --depth 1 https://github.com/melonDS-emu/melonDS.git /tmp/melonds
          cmake -S /tmp/melonds -B /tmp/melonds-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/melonds-build --parallel 2
          find /tmp/melonds-build -type f -name 'melonDS' -executable -print
      - name: Run real emulator and capture screen
        env:
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: '1'
          SDL_AUDIODRIVER: dummy
        run: |
          set -euo pipefail
          mkdir -p evidence
          EMULATOR="$(find /tmp/melonds-build -type f -name melonDS -executable | head -n 1)"
          test -n "$EMULATOR"
          echo "Emulator: $EMULATOR" | tee -a evidence/environment.txt
          "$EMULATOR" --help >> evidence/environment.txt 2>&1 || true
          sha256sum rom/etarium.nds >> evidence/environment.txt
          xvfb-run -a -s '-screen 0 1280x900x24' bash -c '
            set -u
            timeout --signal=TERM 18s "$1" "$2" > evidence/emulator.log 2>&1 &
            emulator_pid=$!
            sleep 9
            window_id="$(xdotool search --onlyvisible --name "melonDS" | head -n 1 || true)"
            if [ -n "$window_id" ]; then
              import -window "$window_id" evidence/melonds-window.png || true
            fi
            wait "$emulator_pid" || status=$?
            echo "emulator_exit=${status:-0}" >> evidence/environment.txt
          ' _ "$EMULATOR" "$GITHUB_WORKSPACE/rom/etarium.nds"
          test -s evidence/melonds-window.png || { echo 'No emulator window captured'; exit 1; }
          python3 - <<'PY'
          from PIL import Image, ImageStat
          from pathlib import Path
          import json
          im = Image.open('evidence/melonds-window.png').convert('RGB')
          stat = ImageStat.Stat(im)
          report = {
              'screenshot_dimensions': list(im.size),
              'channel_standard_deviations': stat.stddev,
              'emulator_window_captured': True,
              'runtime_verified': False,
              'note': 'Window capture proves a GUI appeared, NOT that both DS screens rendered correctly. Review screenshot and logs.'
          }
          Path('evidence/report.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          PY
      - name: Run same upstream ROM under current melonDS
        env:
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: '1'
          SDL_AUDIODRIVER: dummy
        run: |
          set -euo pipefail
          EMULATOR="$(find /tmp/melonds-build -type f -name melonDS -executable | head -n 1)"
          mkdir -p evidence/control
          sha256sum startup-probes/upstream_control.nds > evidence/control/sha256.txt
          timeout -k 3s 22s xvfb-run -a -s '-screen 0 1280x900x24' bash -c '
            "$1" "$2" >/dev/null 2>&1 &
            pid=$!
            sleep 8
            wid="$(timeout 2s xdotool search --onlyvisible --name melonDS | head -n 1 || true)"
            if [ -n "$wid" ]; then timeout -k 2s 4s import -window "$wid" "$3" || true; fi
            kill -TERM "$pid" 2>/dev/null || true
            exit 0
          ' _ "$EMULATOR" "$GITHUB_WORKSPACE/startup-probes/upstream_control.nds" "$GITHUB_WORKSPACE/evidence/control/upstream.png" || true
          test -s evidence/control/upstream.png
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import json
          f=Path('evidence/control/upstream.png')
          im=Image.open(f).convert('RGB')
          report={'capture':str(f),'dimensions':list(im.size),'unique_colours':len(im.getcolors(im.width*im.height) or []),'boot_verified':False}
          Path('evidence/control/report.json').write_text(json.dumps(report,indent=2))
          print(report)
          PY
      - name: Upload emulator evidence (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 14

  legacy-melonds:
    needs: [rom, diagnostic-roms]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: emulator-input-rom
          path: rom
      - uses: actions/download-artifact@v4
        with:
          name: etarium-startup-probes
          path: startup-probes
      - name: Prepare evidence and dependencies
        run: |
          mkdir -p legacy-evidence
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git cmake make g++ pkg-config libsdl2-dev libarchive-dev \
            libgtk-3-dev qtbase5-dev qtbase5-private-dev qtbase5-dev-tools libqt5opengl5-dev qtmultimedia5-dev libslirp-dev extra-cmake-modules \
            xvfb xauth xdotool imagemagick python3-pil
      - name: Restore compiled melonDS 0.9.5
        id: legacy-cache
        uses: actions/cache@v4
        with:
          path: /tmp/melonds-095-build
          key: melonds-095-ubuntu2404-qt5-v1
      - name: Compile melonDS 0.9.5
        run: |
          set -eux
          if [ "${{ steps.legacy-cache.outputs.cache-hit }}" != "true" ]; then
            git clone --depth 1 --branch 0.9.5 https://github.com/melonDS-emu/melonDS.git /tmp/melonds-095
            cmake -S /tmp/melonds-095 -B /tmp/melonds-095-build -DCMAKE_BUILD_TYPE=Release
            cmake --build /tmp/melonds-095-build --parallel 4
          else
            echo "Reusing cached melonDS 0.9.5 executable"
          fi
          find /tmp/melonds-095-build -type f -executable -name 'melonDS' -print | tee legacy-evidence/executables.txt
          test -s legacy-evidence/executables.txt
      - name: Audit legacy melonDS BIOS firmware and direct-boot settings
        run: |
          set -euo pipefail
          {
            echo "melonDS tag: 0.9.5"
            echo "Expected BIOS files: bios7.bin bios9.bin firmware.bin"
            echo "Present BIOS/firmware in runner workspace:"
            find "$GITHUB_WORKSPACE" /tmp/melonds-095-build -maxdepth 3 \
              \( -name 'bios7.bin' -o -name 'bios9.bin' -o -name 'firmware.bin' \) -printf '%p %s bytes\\n' 2>/dev/null || true
            echo "Legacy emulator configurations:"
            find "$HOME" /tmp/melonds-095-build -maxdepth 4 -name 'melonDS.ini' -print 2>/dev/null || true
            echo "No copyrighted BIOS files are downloaded by this workflow."
          } > legacy-evidence/boot-environment.txt
          cat legacy-evidence/boot-environment.txt
      - name: Generate isolated ROM header variants
        run: |
          python3 tests/make_header_variants.py rom/etarium.nds variants
      - name: Test five successive video hypotheses under melonDS 0.9.5
        env:
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: '1'
          SDL_AUDIODRIVER: dummy
        run: |
          set -euo pipefail
          EMULATOR="$(find /tmp/melonds-095-build -type f -name melonDS -executable | head -n 1)"
          mkdir -p legacy-evidence/five-variants
          cp startup-probes/five-variants-manifest.json legacy-evidence/five-variants/manifest.json
          for ROM in startup-probes/0*.nds; do
            name="$(basename "$ROM" .nds)"
            echo "Diagnostic hypothesis $name"
            mkdir -p "legacy-evidence/five-variants/$name"
            for cycle in 1 2; do
              DEST="$GITHUB_WORKSPACE/legacy-evidence/five-variants/$name/cycle-$cycle.png"
              timeout -k 2s 18s xvfb-run -a -s '-screen 0 1280x900x24' bash -c '
                "$1" "$2" >/dev/null 2>&1 &
                pid=$!
                sleep 5
                wid="$(timeout 2s xdotool search --onlyvisible --name melonDS | head -n 1 || true)"
                if [ -n "$wid" ]; then
                  timeout -k 1s 3s import -window "$wid" "$3" >/dev/null 2>&1 || true
                fi
                kill -TERM "$pid" 2>/dev/null || true
              ' _ "$EMULATOR" "$GITHUB_WORKSPACE/$ROM" "$DEST" || true
              if [ -s "$DEST" ]; then sha256sum "$DEST"; else echo "CAPTURE_MISSING $name cycle-$cycle"; fi
            done
          done
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          base=Path('legacy-evidence/five-variants')
          report=[]
          for f in sorted(base.glob('*/cycle-*.png')):
              report.append({'variant':f.parent.name,'capture':str(f.relative_to(base)),
                  'sha256':hashlib.sha256(f.read_bytes()).hexdigest()})
          (base/'captures.json').write_text(json.dumps(report,indent=2))
          print(f'Captured {len(report)} / 10 expected frames')
          PY
      - name: Run 10 sequential emulator control cycles
        env:
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: '1'
          SDL_AUDIODRIVER: dummy
        run: |
          set -euo pipefail
          EMULATOR="$(find /tmp/melonds-095-build -type f -name melonDS -executable | head -n 1)"
          test -n "$EMULATOR"
          python3 tests/ten_cycle_capture.py "$EMULATOR" startup-probes/upstream_control.nds rom/etarium.nds legacy-evidence/ten-cycle
      - name: Capture each variant with melonDS 0.9.5
        env:
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: '1'
          SDL_AUDIODRIVER: dummy
        run: |
          set -euo pipefail
          EMULATOR="$(find /tmp/melonds-095-build -type f -name melonDS -executable | head -n 1)"
          mkdir -p legacy-evidence/variants
          cp variants/manifest.json legacy-evidence/variants/manifest.json
          printf 'arm9_minimal: direct ARM9 framebuffer without IPC; arm7_ipc: pmMainLoop and keys scan\\n' > legacy-evidence/variants/probes.txt
          for ROM in variants/*.nds startup-probes/*.nds; do
            NAME="$(basename "$ROM" .nds)"
            echo "Testing $NAME"
            mkdir -p "legacy-evidence/variants/$NAME"
            # Output is discarded to avoid gigabyte-scale ARM7 spam.
            timeout -k 3s 22s xvfb-run -a -s '-screen 0 1280x900x24' bash -c '
              "$1" "$2" >/dev/null 2>&1 &
              pid=$!
              sleep 7
              wid="$(timeout 2s xdotool search --onlyvisible --name melonDS | head -n 1 || true)"
              if [ -n "$wid" ]; then
                timeout -k 2s 4s import -window "$wid" "$3" || true
              fi
              kill -TERM "$pid" 2>/dev/null || true
              exit 0
            ' _ "$EMULATOR" "$GITHUB_WORKSPACE/$ROM" "$GITHUB_WORKSPACE/legacy-evidence/variants/$NAME/screen.png" || true
            if [ ! -s "legacy-evidence/variants/$NAME/screen.png" ]; then
              echo "Screenshot unavailable" > "legacy-evidence/variants/$NAME/status.txt"
            else
              echo "Screenshot captured; visual assessment required" > "legacy-evidence/variants/$NAME/status.txt"
            fi
          done
      - name: Start legacy emulator and capture output
        env:
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: '1'
          SDL_AUDIODRIVER: dummy
        run: |
          set -euo pipefail
          EMULATOR="$(find /tmp/melonds-095-build -type f -name melonDS -executable | head -n 1)"
          test -n "$EMULATOR"
          sha256sum rom/etarium.nds > legacy-evidence/rom-sha256.txt
          # Hard cap on the entire virtual-display session, including GUI children.
          # The previous workflow could wait indefinitely for an emulator child.
          timeout -k 5s 35s xvfb-run -a -s '-screen 0 1280x900x24' bash -c '
            set -u
            # Discard verbose ARM7 diagnostic spam; avoid fragile nested quoting.
            "$1" "$2" >/dev/null 2>&1 &
            pid=$!
            sleep 8
            wid="$(timeout 3s xdotool search --onlyvisible --name melonDS | head -n 1 || true)"
            if [ -n "$wid" ]; then
              timeout -k 2s 5s import -window "$wid" legacy-evidence/legacy-screen.png || true
            fi
            kill -TERM "$pid" 2>/dev/null || true
            sleep 1
            kill -KILL "$pid" 2>/dev/null || true
            echo "Emulator session ended" >> legacy-evidence/emulator.log
            exit 0
          ' _ "$EMULATOR" "$GITHUB_WORKSPACE/rom/etarium.nds" || {
            code=$?
            echo "Legacy emulator session exited with status $code" | tee -a legacy-evidence/emulator.log
            exit "$code"
          }
          test -s legacy-evidence/legacy-screen.png
          python3 - <<'PY'
          from PIL import Image, ImageStat
          from pathlib import Path
          import json
          im = Image.open('legacy-evidence/legacy-screen.png').convert('RGB')
          data = {'version': '0.9.5', 'dimensions': im.size,
                  'rgb_standard_deviation': ImageStat.Stat(im).stddev,
                  'note': 'Screenshot is diagnostic; manually inspect both DS screens.'}
          Path('legacy-evidence/report.json').write_text(json.dumps(data, indent=2))
          print(data)
          PY
      - name: Evaluate all 10 legacy emulator cycles (fail on identical white captures)
        if: always()
        run: |
          python3 tests/assess_legacy.py legacy-evidence/ten-cycle
      - name: Upload legacy emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-melonds-095-evidence
          path: legacy-evidence/
          if-no-files-found: warn
          retention-days: 14
