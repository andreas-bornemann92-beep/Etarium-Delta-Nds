name: Etarium Mobile L city and animation
on:
  push:
    branches: [gh-pages]
    paths: ['l/**','.github/workflows/mobile-l-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test game flow and generate screenshot
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 &
          sleep 2
          node l/smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: etarium-l-city-evidence
          path: etarium-l-city.png
          if-no-files-found: warn
