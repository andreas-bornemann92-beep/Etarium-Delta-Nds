name: Midgard Block116 isolated switch tests
on:
  push:
    branches:
      - test/midgard-block116-20261119
    paths:
      - 'midgard-tests/**'
      - '.github/workflows/midgard-block116-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  switch-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test extracted Block116 switch and KO functions
        run: node midgard-tests/block116/switch.test.cjs
