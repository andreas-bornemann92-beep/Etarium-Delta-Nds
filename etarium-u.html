<main>

<script>
(function(){
 window.etariumBootErrors=[];
 window.etariumFatal=function(err,phase){
  var message=(err&&err.message)||String(err||'Unbekannter Fehler');
  window.etariumBootErrors.push({phase:phase||'Start',message:message,stack:err&&err.stack||''});
  var box=document.getElementById('boot-error');
  var detail=document.getElementById('boot-error-message');
  if(box&&detail){box.hidden=false;detail.textContent=(phase||'Spielstart')+': '+message;}
  var status=document.getElementById('status');if(status)status.textContent='Startproblem erkannt – Fehlerdetails unten.';
  console.error('[Etarium P]',phase,err);
 };
 window.addEventListener('error',function(e){window.etariumFatal(e.error||e.message,'JavaScript')});
 window.addEventListener('unhandledrejection',function(e){window.etariumFatal(e.reason,'Asynchrone Aufgabe')});
 document.getElementById('boot-retry').addEventListener('click',function(){location.reload()});
})();
</script>

<script>
(function(){
try{
"use strict";
var canvas=document.getElementById('game'),g=canvas.getContext('2d');
var status=document.getElementById('status'),town=window.ETARIUM_TOWN,T=32,W=town.W,H=town.H,VW=512,VH=384;
if(!town||!window.ETARIUM_NPCS||!window.ETARIUM_BATTLE||!window.ETARIUM_INTERIORS||!window.ETARIUM_DIALOGS||!window.initCharacterFlow)throw Error('Spielmodule nicht vollständig geladen: Stadt, NPCs, Kampf oder Editor');
var world=town.world,player={x:town.spawn.x,y:town.spawn.y,fromX:town.spawn.x,fromY:town.spawn.y,toX:town.spawn.x,toY:town.spawn.y,face:'up'},cam={x:0,y:0};
var running=false,walking=false,walkStart=0,duration=185,steps=0,held=null,nextMove=0,stepCycle=0;
var renderFrames=0,lastFrameTime=0;
var npcs=window.ETARIUM_NPCS,battle=window.ETARIUM_BATTLE,rooms=window.ETARIUM_INTERIORS,dialogue=window.ETARIUM_DIALOGS,sprinting=false,selectTab='character',flowManager=null,gamePanel=document.getElementById('game-panel'),panelTitle=document.getElementById('panel-title'),panelBody=document.getElementById('panel-body'),panelActions=document.getElementById('panel-actions'),panelMode=null;
function clamp(n,a,b){return Math.min(b,Math.max(a,n))}
function solid(x,y){return town.solid(x,y)}
function setMessage(s){status.textContent=s}
function reset(start){
 player={x:town.spawn.x,y:town.spawn.y,fromX:town.spawn.x,fromY:town.spawn.y,toX:town.spawn.x,toY:town.spawn.y,face:'up'};
 cam.x=clamp(player.x*T-VW/2,0,W*T-VW);cam.y=clamp(player.y*T-VH/2,0,H*T-VH);
 steps=0;walking=false;held=null;sprinting=false;nextMove=0;stepCycle=0;running=start;
 if(start){npcs.reset();battle.leave();if(rooms.state.active)rooms.exit()}
 document.querySelectorAll('[data-dir]').forEach(function(b){b.classList.remove('held')});
 setMessage(start?'Eichenbrunn · Südtor':'Eichenbrunn');hidePanel();
}
function attempt(dir,time){
 if(!running||walking||panelMode||battle.state.active)return false;
 var dx=dir==='left'?-1:dir==='right'?1:0,dy=dir==='up'?-1:dir==='down'?1:0;
 player.face=dir;
 if(rooms.state.active){
  if(rooms.shouldExit(player.x,player.y,dir)){
   var back=rooms.exit();
   player.x=back.x;player.y=back.y;player.fromX=back.x;player.fromY=back.y;player.toX=back.x;player.toY=back.y;
   walking=false;held=null;nextMove=time+160;
   setMessage('Eichenbrunn · Stadt');if(flowManager)flowManager.save();return true;
  }
  if(rooms.solid(player.x+dx,player.y+dy))return false;
 }else{
  var door=rooms.entrance(player.x,player.y,dir);
  if(door){
   rooms.enter(door,player.x,player.y);
   player.x=8;player.y=9;player.fromX=8;player.fromY=9;player.toX=8;player.toY=9;
   walking=false;held=null;nextMove=time+160;
   setMessage(door.name+' · Innenraum');return true;
  }
  if(solid(player.x+dx,player.y+dy)||npcs.occupied(player.x+dx,player.y+dy))return false;
 }
 player.fromX=player.x;player.fromY=player.y;
 player.toX=player.x+dx;player.toY=player.y+dy;
 player.x=player.toX;player.y=player.toY;
 walking=true;walkStart=time;duration=sprinting?108:185;steps++;stepCycle=(stepCycle+1)%6;
 if(flowManager&&!rooms.state.active)flowManager.save();return true;
}
function rect(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h)}
function tile(t,sx,sy,xx,yy,time){town.drawTile(g,t,sx,sy,xx,yy,time)}
var sprites={},spriteReady=false;
var assetData=window.ETARIUM_CHARACTER_ASSETS||{};
['down','up','right'].forEach(function(name){
 var image=new Image();
 image.onload=function(){spriteReady=true};
 image.src=assetData[name]||'';
 sprites[name]=image;
});

var animationFrames={down:[],up:[],right:[]},frameCount=0;
function createWalkFrames(image,dir){
 var results=[],phases=6;
 for(var i=0;i<phases;i++){
  var canvasFrame=document.createElement('canvas');canvasFrame.width=40;canvasFrame.height=104;
  var c=canvasFrame.getContext('2d');c.imageSmoothingEnabled=true;
  if(i===0){c.drawImage(image,0,0);results.push(canvasFrame);continue}
  var t=i/phases,stride=Math.sin(t*Math.PI*2),swing=Math.round(3.8*stride);
  var bob=Math.round(Math.abs(Math.sin(t*Math.PI*2))*1);
  // Preserve head and original costume artwork; separately shift legs and arms.
  c.drawImage(image,0,0,40,63,0,bob,40,63);
  if(dir==='right'){
   c.drawImage(image,0,61,40,43,swing,61-bob,40,43);
  }else{
   c.drawImage(image,0,60,20,44,swing,60-bob,20,44);
   c.drawImage(image,20,60,20,44,20-swing,60+bob,20,44);
  }
  // Small alternating arm motion with waist stabilization.
  c.drawImage(image,0,32,8,32,-Math.round(stride*1.6),32+bob,8,32);
  c.drawImage(image,32,32,8,32,32+Math.round(stride*1.6),32-bob,8,32);
  c.drawImage(image,8,52,24,12,8,52+bob,24,12);
  results.push(canvasFrame);
 }
 return results;
}
['down','up','right'].forEach(function(dir){
 var img=sprites[dir];
 img.addEventListener('load',function(){
  animationFrames[dir]=createWalkFrames(img,dir);
  frameCount=animationFrames.down.length+animationFrames.up.length+animationFrames.right.length;
 });
 if(img.complete&&img.naturalWidth){
  animationFrames[dir]=createWalkFrames(img,dir);
  frameCount=animationFrames.down.length+animationFrames.up.length+animationFrames.right.length;
 }
});
var femaleCache={},maleStyleCache={};
function styleMale(img,dir,phase,ch){
 var key=[dir,phase,ch.hair,ch.haircolor].join('|');if(maleStyleCache[key])return maleStyleCache[key];
 var cn=document.createElement('canvas');cn.width=40;cn.height=104;
 var c=cn.getContext('2d');c.drawImage(img,0,0,40,104);
 var hair=ch.haircolor||'#60402d';
 c.fillStyle=hair;
 if(ch.hair==='0'){
  c.globalAlpha=.72;c.fillRect(10,6,20,5);c.fillRect(13,3,14,5);
 }else if(ch.hair==='1'){
  c.globalAlpha=.76;c.fillRect(8,4,24,10);c.fillRect(8,10,5,13);c.fillRect(27,10,5,13);
 }else{
  c.globalAlpha=.83;c.fillRect(7,8,26,7);c.fillRect(10,1,9,9);c.fillRect(22,2,10,8);c.fillRect(8,12,5,12);
 }
 c.globalAlpha=1;maleStyleCache[key]=cn;return cn;
}

function femaleFrame(dir,phase,color,hair){
 var key=[dir,phase,color,hair].join(':');
 if(femaleCache[key])return femaleCache[key];
 var cn=document.createElement('canvas');cn.width=40;cn.height=104;
 var c=cn.getContext('2d');
 function r(x,y,w,h,col){c.fillStyle=col;c.fillRect(x,y,w,h)}
 var pace=[0,2,3,0,-2,-3][phase]||0,bounce=phase%2?-1:0;
 // Original class-neutral outfit palette: linen shirt, brown trousers and boots.
 r(10-pace,70,9,23,'#65594a');r(21+pace,70,9,23,'#65594a');
 r(9-pace,90,10,13,'#4d3629');r(21+pace,90,10,13,'#4d3629');
 r(7,35+bounce,26,38,'#e7d8bb');r(9,68,22,9,'#795d45');
 r(4+pace,43,5,25,'#e7bd9b');r(31-pace,43,5,25,'#e7bd9b');
 r(11,13+bounce,18,24,'#efc49e');r(9,9+bounce,22,14,color);
 if(hair==='1'){r(8,20,5,24,color);r(27,20,5,24,color)}
 if(hair==='2'){r(7,8,26,9,color);r(13,5,14,9,color)}
 if(hair==='3'){r(6,17,5,38,color);r(29,17,5,38,color)}
 if(dir==='down'){r(16,27+bounce,2,2,'#27202b');r(24,27+bounce,2,2,'#27202b')}
 else if(dir==='right'){r(26,28+bounce,3,2,'#27202b')}
 r(9,37+bounce,22,4,'#c2b293');
 femaleCache[key]=cn;return cn;
}
function hero(x,y,time){
 var direction=(player.face==='left'||player.face==='right')?'right':player.face;
 var src=sprites[direction],frames=animationFrames[direction];
 var progress=walking?clamp((time-walkStart)/duration,0,1):0;
 // Six continuous gait phases; idle keeps the original approved portrait.
 var phase=walking?Math.min(5,Math.floor(progress*6)):0;
 var image=frames&&frames[phase]?frames[phase]:src;
 var chosen=flowManager?flowManager.getCharacter():null;
 if(chosen&&chosen.gender==='female')image=femaleFrame(direction,phase,chosen.haircolor,chosen.hair);
 else if(chosen&&image&&(image.width||image.naturalWidth))image=styleMale(image,direction,phase,chosen);
 var lift=walking?-(Math.sin(progress*Math.PI*3)**2)*(sprinting?1.7:1.15):0;
 var width=25,height=49;
 if(chosen){width={slim:22,normal:25,strong:29,full:33}[chosen.body]||25;
 height={small:45,medium:49,tall:54}[chosen.height]||49}
 var left=Math.round(x+16-width/2),top=Math.round(y+32-height+lift);
 rect(x+7,y+28,18,3,'rgba(21,40,32,0.28)');
 if(!image||!(image.width||image.naturalWidth))return;
 g.save();
 g.translate(left+width/2,top+height*0.74);
 if(player.face==='right')g.scale(-1,1);
 g.drawImage(image,-width/2,-height*0.74,width,height);
 g.fillStyle='#d3b48a';g.fillRect(-width*.23,height*.12,Math.max(5,width*.46),1.5);
 g.fillStyle='#463b33';g.fillRect(-width*.30,height*.245,Math.max(5,width*.22),2);g.fillRect(width*.08,height*.245,Math.max(5,width*.22),2);
 g.restore();
}
function render(time){
 renderFrames++;lastFrameTime=time;
 if(battle.state.active){battle.draw(g,VW,VH,time);requestAnimationFrame(safeRender);return}
 if(rooms.state.active){
  var indoorProgress=walking?clamp((time-walkStart)/duration,0,1):1;
  if(walking&&indoorProgress>=1)walking=false;
  var indoorX=walking?player.fromX+(player.toX-player.fromX)*indoorProgress:player.x;
  var indoorY=walking?player.fromY+(player.toY-player.fromY)*indoorProgress:player.y;
  rooms.draw(g,time);hero(indoorX*T,indoorY*T,time);
  if(held&&running&&!walking&&!panelMode&&time>=nextMove){attempt(held,time);nextMove=time+(sprinting?105:175)}
  requestAnimationFrame(safeRender);return;
 }
 var progress=walking?clamp((time-walkStart)/duration,0,1):1;
 if(walking&&progress>=1)walking=false;
 var xx=walking?player.fromX+(player.toX-player.fromX)*progress:player.x;
 var yy=walking?player.fromY+(player.toY-player.fromY)*progress:player.y;
 var desiredX=clamp(xx*T+T/2-VW/2,0,W*T-VW);
 var desiredY=clamp(yy*T+T/2-VH/2,0,H*T-VH);
 cam.x+=(desiredX-cam.x)*0.12;cam.y+=(desiredY-cam.y)*0.12;
 g.clearRect(0,0,VW,VH);
 var fromX=Math.max(0,Math.floor(cam.x/T)),fromY=Math.max(0,Math.floor(cam.y/T));
 for(var y=fromY;y<Math.min(H,fromY+14);y++)for(var x=fromX;x<Math.min(W,fromX+18);x++){
 tile(world[y][x],x*T-cam.x,y*T-cam.y,x,y,time);
 }
 town.drawScenery(g,cam.x,cam.y,time);
 npcs.update(time,!running||!!panelMode,player.x,player.y);
 npcs.draw(g,cam,time);
 hero(xx*T-cam.x,yy*T-cam.y,time);
 rect(8,8,224,32,'rgba(19,28,38,0.88)');
 g.fillStyle='#ffffff';g.font='bold 13px system-ui';g.fillText('Eichenbrunn  ·  Schritte '+steps,16,28);
 if(!running){rect(54,151,404,70,'rgba(17,20,30,0.88)');g.fillStyle='#fff';g.font='bold 22px system-ui';g.fillText('ETARIUM MOBILE U',140,183);g.font='14px system-ui';g.fillText('Neues Spiel starten',191,206)}
 if(held&&running&&!walking&&!panelMode&&time>=nextMove){attempt(held,time);nextMove=time+(sprinting?105:175)}
 requestAnimationFrame(safeRender);
}
function safeRender(t){try{render(t)}catch(e){window.etariumFatal(e,'Zeichnen der Spielwelt')}}
function hidePanel(){gamePanel.hidden=true;panelMode=null;release();}
function showPanel(mode,title,body,buttons){
 release();panelMode=mode;gamePanel.hidden=false;
 panelTitle.textContent=title;panelBody.textContent=body;
 panelActions.replaceChildren();
 (buttons||[{label:'Schließen',fn:hidePanel}]).forEach(function(item){
  var b=document.createElement('button');b.textContent=item.label;
  b.addEventListener('click',item.fn);panelActions.appendChild(b);
 });
}
function renderDialogue(node){
 if(!node){hidePanel();return}
 dialogue.mark(node.id);
 var character=dialogue.actors[node.npc];
 var controls=node.type==='choice'
   ?node.choices.map(function(choice){return {label:choice.label,fn:function(){
     var result=dialogue.choose(node,choice.label);
     if(!result){hidePanel();return}
     if(result.effect==='kampf_starten'){
       hidePanel();battle.enter(character.name,performance.now());release();setSprint(false);
       setMessage('Kampfvorschau · B zum Verlassen');return;
     }
     if(result.effect==='brunnen_geprueft')npcs.query();
     renderDialogue(result.node);
   }}})
   :[{label:node.next?'Weiter':'Schließen',fn:function(){renderDialogue(dialogue.next(node))}}];
 if(node.type!=='choice'&&node.next&&node.next===character.start)controls=[{label:'Gespräch beenden',fn:hidePanel},{label:'Noch einmal',fn:function(){renderDialogue(dialogue.next(node))}}];
 showPanel('npc-dialogue',character.name,node.text,controls);
}
function interact(){
 if(flowManager&&flowManager.getStage()==='editor'){document.getElementById('j-confirm').click();return;}
 if(flowManager&&flowManager.getStage()==='title'){document.getElementById('j-new').click();return;}
 if(flowManager&&flowManager.getStage()!=='world')return;
 if(panelMode){var confirm=panelActions.querySelector('button');if(confirm)confirm.click();else hidePanel();return;}
 if(battle.state.active){setMessage('Kampfsimulation – B: zurück zur Stadt');return}
 if(rooms.state.active){showPanel('dialog',rooms.state.name,'Ein einfacher Innenraum. Gehe zum Ausgang unten in der Mitte, um wieder nach Eichenbrunn zu gelangen.');return}
 var actor=npcs.nearby(player.x,player.y,2);
 if(actor){
   var first=dialogue.root(actor.id);
   if(first){renderDialogue(first);return}
 }
 var landmarks=[
  {name:'Gasthaus',x:12,y:12,w:9,h:8},
  {name:'Laden',x:33,y:12,w:9,h:8},
  {name:'Wohnhaus',x:9,y:25,w:9,h:6},
  {name:'Wohnhaus',x:35,y:25,w:9,h:6},
  {name:'Brunnenplatz',x:24,y:16,w:5,h:5},
  {name:'Südtor',x:24,y:29,w:6,h:4}
 ];
 var nearest=null,distance=999;
 landmarks.forEach(function(p){
  var d=Math.abs(player.x-p.x)+Math.abs(player.y-p.y);
  if(d<distance){nearest=p;distance=d}
 });
 if(distance<=5){
  var desc=nearest.name==='Gasthaus'?'Eine warme Herberge. Die Tür wird in einer späteren Version begehbar.':
   nearest.name==='Laden'?'Hier wird später ein Händler seine Waren anbieten.':
   nearest.name==='Brunnenplatz'?'Das Wasser glitzert im Brunnen von Eichenbrunn.':
   nearest.name==='Südtor'?'Du stehst am Eingang der Stadt Eichenbrunn.':'Ein kleines Wohnhaus von Eichenbrunn.';
  showPanel('dialog',nearest.name,desc);
 }else showPanel('dialog','Umgebung','Hier gibt es gerade nichts zu untersuchen.');
}
function actionB(){
 if(panelMode){hidePanel();return}
 if(battle.state.active){battle.leave();setMessage('Eichenbrunn · Südtor');return}
 if(flowManager&&flowManager.getStage()==='editor'){
  document.getElementById('j-back').click();return;
 }
}
function setSprint(enabled){
 sprinting=!!enabled;
 document.getElementById('action-b').classList.toggle('held',sprinting);
}
function actionStart(){
 if(!flowManager||flowManager.getStage()!=='world')return;
 if(battle.state.active){setMessage('Kampfvorschau · B beendet die Simulation');return}
 if(panelMode==='start'){hidePanel();return}
 showPanel('start','Spielmenü','Du bist in Eichenbrunn.',[
  {label:'Fortsetzen',fn:hidePanel},
  {label:'Speichern',fn:function(){flowManager.save();showPanel('dialog','Gespeichert','Dein Spielstand wurde lokal auf diesem Gerät gespeichert.');}},
  {label:'Zum Titelbildschirm',fn:function(){hidePanel();flowManager.openMenu()}}
 ]);
}
function showSelectTab(tab){
 selectTab=tab;
 var ch=flowManager.getCharacter();
 var characterText=ch.name+' · '+(ch.gender==='male'?'Männlich':'Weiblich')+' · Körperbau: '+ch.body+' · Größe: '+ch.height+' · Eichenbrunn';
 var spiritText='Geister: 0 / 10. Noch keine Geister im Team. Die Geisterverwaltung folgt als Entwicklungsmodul.';
 showPanel('select',tab==='spirits'?'Geister':'Charakter',tab==='spirits'?spiritText:characterText,[
  {label:'Charakter',fn:function(){showSelectTab('character')}},
  {label:'Geister',fn:function(){showSelectTab('spirits')}},
  {label:'Zurück',fn:hidePanel}
 ]);
}
function actionSelect(){
 if(!flowManager||flowManager.getStage()!=='world'||battle.state.active)return;
 if(panelMode==='select'){hidePanel();return}
 showSelectTab('character');
}
function hold(dir){held=dir;nextMove=0;document.querySelectorAll('[data-dir]').forEach(function(b){b.classList.toggle('held',b.getAttribute('data-dir')===dir)})}
function release(){held=null;document.querySelectorAll('[data-dir]').forEach(function(b){b.classList.remove('held')})}
document.querySelectorAll('[data-dir]').forEach(function(el){
 el.addEventListener('pointerdown',function(e){e.preventDefault();hold(el.getAttribute('data-dir'));if(el.setPointerCapture)el.setPointerCapture(e.pointerId)});
 el.addEventListener('pointerup',release);el.addEventListener('pointercancel',release);el.addEventListener('lostpointercapture',release);
 el.addEventListener('click',function(){if(running&&!walking)attempt(el.getAttribute('data-dir'),performance.now())});
});
document.getElementById('action-a').addEventListener('click',interact);
var bControl=document.getElementById('action-b');
bControl.addEventListener('pointerdown',function(e){
 e.preventDefault();
 if(panelMode||flowManager&&flowManager.getStage()==='editor'){actionB();return}
 if(flowManager&&flowManager.getStage()==='world'&&!battle.state.active){setSprint(true);if(bControl.setPointerCapture)bControl.setPointerCapture(e.pointerId)}
});
['pointerup','pointercancel','lostpointercapture'].forEach(function(ev){
 bControl.addEventListener(ev,function(){setSprint(false)});
});
bControl.addEventListener('click',function(){
 if(panelMode||battle.state.active||flowManager&&flowManager.getStage()==='editor')actionB();
});
document.getElementById('start').addEventListener('click',actionStart);
document.getElementById('select').addEventListener('click',actionSelect);
window.addEventListener('keydown',function(e){var dirs={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};if(dirs[e.key]){e.preventDefault();hold(dirs[e.key])}});
window.addEventListener('keyup',function(e){if(e.key.startsWith('Arrow'))release()});
window.addEventListener('blur',function(){release();setSprint(false)});
window.addEventListener('keydown',function(e){if(e.key==='Enter')actionStart();else if(e.key==='Escape')actionB();else if(e.key==='Shift')setSprint(true);else if(e.key===' '){e.preventDefault();interact()}});
window.addEventListener('keyup',function(e){if(e.key==='Shift')setSprint(false)});
window.etariumDiagnostics={getState:function(){return {running:running,x:player.x,y:player.y,steps:steps,cameraX:cam.x,cameraY:cam.y,walking:walking,facing:player.face,stepCycle:stepCycle,animationFrames:frameCount,renderFrames:renderFrames,lastFrameTime:lastFrameTime,bootErrors:window.etariumBootErrors.slice(),npcs:npcs.getState(),dialogue:{total:dialogue.validate().count,checked:dialogue.validate().ok,flags:dialogue.flags,visited:Object.keys(dialogue.seen).length},battle:battle.getState(),npcResult:npcs.getResult(),location:rooms.state.active?rooms.state.name:'Eichenbrunn',interior:{active:rooms.state.active,id:rooms.state.id,entries:rooms.state.entryCount},panel:panelMode,sprinting:sprinting,selectTab:selectTab,moveDuration:duration,stage:flowManager?flowManager.getStage():'boot',character:flowManager?flowManager.getCharacter():null}},start:function(){reset(true)},move:function(d){return attempt(d,performance.now())}};
reset(false);
flowManager=window.initCharacterFlow({
 startFresh:function(){reset(true)},
 validateStart:function(){return !!(running&&npcs&&town&&player&&canvas&&g&&window.etariumBootErrors.length===0)},
 afterStart:function(){setMessage('Eichenbrunn · Dialogmatrix mit 100 Texten aktiv')},
 reportError:function(e,phase){window.etariumFatal(e,phase)},
 stop:function(){running=false;held=null;walking=false;setSprint(false);battle.leave();if(rooms.state.active)rooms.exit()},
 getPosition:function(){return rooms.state.active?{x:rooms.state.returnX,y:rooms.state.returnY,steps:steps}:{x:player.x,y:player.y,steps:steps}},
 restore:function(data){
  if(Number.isInteger(data.x)&&Number.isInteger(data.y)&&!solid(data.x,data.y)){
   player.x=data.x;player.y=data.y;
   player.fromX=data.x;player.fromY=data.y;player.toX=data.x;player.toY=data.y;
   steps=Number.isInteger(data.steps)?data.steps:0;
  }
 }
});
requestAnimationFrame(safeRender);
}catch(err){window.etariumFatal(err,'Initialisierung')}
})();
</script>
</body></html>
